name: Publicar imagem Docker - mfe-daruix-ordens-compra

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rickaicka/mfe-ordens-compra

concurrency:
  group: deploy-ordens-compra
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build e publicação
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Compilar e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy VPS - ordens-compra
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    permissions:
      contents: read

    steps:
      - name: Validar configuração do deploy
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Secret $name ausente ou vazio. Configure em Settings > Secrets and variables > Actions ou no environment production deste repositório."
              failed=1
            fi
          done
          if (( failed )); then
            exit 1
          fi
          if [[ "$VPS_USER" == *[[:space:]@/]* || "$VPS_USER" == -* ]]; then
            echo '::error::VPS_USER inválido. Informe somente o usuário SSH, por exemplo ricardo, sem espaços ou @host.'
            exit 1
          fi
          if [[ "$VPS_HOST" == *[[:space:]@/]* || "$VPS_HOST" == -* ]]; then
            echo '::error::VPS_HOST inválido. Informe somente o IP ou hostname, sem usuário, protocolo, porta ou espaços. Para IPv6, use o endereço sem colchetes.'
            exit 1
          fi
          if [[ ! "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo '::error::A variável VPS_PORT deve conter uma porta numérica entre 1 e 65535.'
            exit 1
          fi
          if (( 10#$VPS_PORT < 1 || 10#$VPS_PORT > 65535 )); then
            echo '::error::A variável VPS_PORT deve estar entre 1 e 65535.'
            exit 1
          fi

      - name: Configurar SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar ordens-compra na VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -l "$VPS_USER" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -- "$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/daruix-hub
          # A VPS precisa ter acesso pré-configurado ao GHCR, caso a imagem seja privada.
          docker compose -f compose.yml -f compose.source.yml pull ordens-compra
          docker compose -f compose.yml -f compose.source.yml up -d --no-deps --force-recreate ordens-compra
          container_id="$(docker compose -f compose.yml -f compose.source.yml ps -q ordens-compra)"
          test -n "$container_id"
          for attempt in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$status" = running ] && { [ "$health" = healthy ] || [ "$health" = none ]; }; then
              echo 'Deploy ordens-compra concluído: container em execução, health='"$health"
              exit 0
            fi
            if [ "$status" != running ] || [ "$health" = unhealthy ]; then
              docker logs --tail 80 "$container_id" || true
              echo 'Deploy ordens-compra falhou: status='"$status"' health='"$health" >&2
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 80 "$container_id" || true
          echo 'Timeout aguardando healthcheck do ordens-compra' >&2
          exit 1
          REMOTE
